<div class="constraint-container" (mouseleave)="emitConstraint()">
  <div class="skills-section">
    @for (s of constraint.skills; track $index; let i = $index) {
    <div>
      <mat-form-field appearance="fill">
        <mat-label>Choose a skill</mat-label>
        <mat-select
          [(value)]="constraint.skills[i]"
          [formControl]="skillsFormCtrl[i]"
          (selectionChange)="emitConstraint()"
        >
          @for (skill of skills; track skill) {
          <mat-option [value]="skill">
            {{ skill }}
          </mat-option>
          }
        </mat-select>
      </mat-form-field>
      @if (constraint.skills.length > 1) {
      <button mat-icon-button color="warn" (click)="deleteSkill(i)">
        <mat-icon>cancel</mat-icon>
      </button>
      }
    </div>
    }
  </div>
  <div class="additional-items">
    <button
      mat-raised-button
      (click)="addSkill()"
      color="nurse-blue"
      class="add-button"
    >
      Add skill
    </button>
    <app-weight
      [(weight)]="constraint.weight"
      (errorState)="updateWeightErrorState($event)"
      [label]="weightLabel"
    ></app-weight>
  </div>
</div>
