<div class="shiftType-container" (mouseleave)="emitShiftType()"></div>
<div class="content" mat-dialog-content>
  <div class="nameShiftTypeContainer">
    <h2>Shift type name</h2>
    <hr />
    <div class="formContainer">
      <mat-form-field class="nameForm" appearance="fill">
        <mat-label>Enter shift type name</mat-label>
        <input
          matInput
          [(ngModel)]="shiftType.name"
          [formControl]="nameShiftTypeFormCtrl"
          (keyup)="emitShiftType()"
        />
      </mat-form-field>
      @if (nameExist() && shiftTypeStartName === '') {
      <mat-error>Shift type name is already used</mat-error>
      }
    </div>
  </div>
  <div class="shifts-Section">
    <h2 class="shiftSectionTitle">Shifts</h2>
    <hr />
    <div class="formContainer">
      @if (localShifts.length > 0) {
      <div>
        <mat-form-field appearance="fill">
          <mat-label>Select a shift</mat-label>
          <mat-select
            [(value)]="selectedShift"
            (selectionChange)="emitShiftType()"
          >
            @for (shift of localShifts; track shift) {
            <mat-option [value]="shift">
              {{ shift }}
            </mat-option>
            }
          </mat-select>
        </mat-form-field>
        <button
          mat-raised-button
          class="addShiftButton flex-row-center-container"
          (click)="addShift()"
          color="nurse-blue"
        >
          add Shift
        </button>
      </div>
      }
    </div>
    <table class="shiftTable">
      @for (shift of shiftType.shifts; track shift) {
      <th>
        <div class="table-element-container flex-row-center-container">
          <td class="shiftName">
            {{ shift }}
          </td>
          <button mat-icon-button (click)="removeShift(shift)">
            <mat-icon>cancel</mat-icon>
          </button>
        </div>
      </th>
      }
    </table>
  </div>
</div>
