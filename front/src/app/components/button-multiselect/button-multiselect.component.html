@for (customSelector of customSelectors; track customSelector) {
<button
  mat-raised-button
  (click)="applyCustomSelection(customSelector.elementsToSelect)"
  [color]="
    isCustomSelectorActive(customSelector.elementsToSelect) ? 'primary' : ''
  "
>
  {{ customSelector.name }}
</button>
}
<button
  mat-raised-button
  (click)="selectAll()"
  [color]="areAllSelected() ? 'primary' : ''"
>
  All
</button>
<button mat-raised-button (click)="deselectAll()" color="warn">Clear</button>
<hr />
@for (element of allPossibleElements; track element) {
<button
  mat-raised-button
  (click)="toggleElement(element)"
  [color]="isSelected(element) ? 'primary' : ''"
>
  {{ element }}
</button>
}
