@if (connectedUser) {
<div class="main-menu-container">
  <app-header></app-header>
  <div class="main-menu-page-buttons-container">
    @for (button of buttons; track button; let i = $index) {
    <mat-card class="button-container">
      @if (show(button)) {
      <button
        align="getAlignemntDirection(button,i)"
        (click)="redirect(button)"
      >
        <img [src]="button.icon" align="left" />
        <span>
          <h1>{{ button.title }}</h1>
          {{ button.description }}
        </span>
      </button>
      }
    </mat-card>
    }
  </div>
</div>
} @else {
<app-not-connected></app-not-connected>
}
