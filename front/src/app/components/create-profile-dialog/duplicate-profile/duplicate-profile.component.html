<div class="title" mat-dialog-title>Duplicate profile</div>
<div class="empty-profile-container">
  <h2>Profile name</h2>
  <hr />
  <div class="name-input">
    <mat-form-field class="nameField" appearance="fill">
      <mat-label>Enter a name</mat-label>
      <input matInput [(ngModel)]="name" [formControl]="nameCtrl" />
    </mat-form-field>
    @if (nameExist()) {
    <mat-error> The profile name is already used </mat-error>
    } @if (nameCtrl.hasError('pattern')) {
    <mat-error> Profile name should not contain empty spaces </mat-error>
    }
  </div>
  <div class="buttons-container">
    <button mat-raised-button color="warn" [mat-dialog-close]="true">
      Cancel
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="create()"
      [disabled]="hasError()"
    >
      Submit
    </button>
  </div>
</div>
