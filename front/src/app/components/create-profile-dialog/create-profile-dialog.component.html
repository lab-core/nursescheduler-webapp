<div class="profile-container">
  <mat-card class="img-container">
    <img src="../../../assets/background.png" />
  </mat-card>

  <mat-card class="info-container">
    @if (data.profiles.length === 0) {
    <div class="text-container">
      <h1>Welcome to Nurse Scheduler application!</h1>
      <h3>Create or import a hospital profile to get started</h3>
    </div>
    } @else {
    <h1>Create or import a hospital profile to get started</h1>
    }

    <div class="button-container">
      <div class="create-empty-section">
        <button
          mat-raised-button
          color="nurse-blue"
          (click)="createEmptyProfile()"
          class="action-button"
          matTooltip="You can create an empty profile by specifying only the profile's name"
          matTooltipPosition="right"
          [mat-dialog-close]="true"
        >
          Create profile
        </button>
      </div>
      <div class="import-section" id="import-profil-button">
        <button
          mat-raised-button
          color="nurse-blue"
          (click)="importProfile()"
          class="action-button"
          matTooltip="You can also import a profile from a file"
          matTooltipPosition="right"
        >
          Import profile
        </button>
      </div>
    </div>
    @if (data.closeDisplayed) {
    <button
      mat-raised-button
      class="close-button"
      color="warn"
      [mat-dialog-close]="true"
    >
      Close
    </button>
    }
  </mat-card>
</div>
